<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e14;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .canvas {
    width: 600px;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* === ICON MARK === */
  .icon {
    position: relative;
    width: 180px;
    height: 144px;
    margin-bottom: 28px;
  }

  .layer {
    position: absolute;
    background: #111d2b;
    border-radius: 5px 5px 1px 1px;
  }

  .l1 { bottom: 0;   left: 0;   width: 180px; height: 24px; background: #131f2e; }
  .l2 { bottom: 23px; left: 12px; width: 156px; height: 24px; background: #182638; }
  .l3 { bottom: 46px; left: 24px; width: 132px; height: 24px; background: #1c2d42; }
  .l4 { bottom: 69px; left: 36px; width: 108px; height: 24px; background: #20344d; }
  .l5 { bottom: 92px; left: 48px; width: 84px;  height: 24px; background: #253b58; }
  .l6 { bottom: 115px;left: 60px; width: 60px;  height: 24px; background: #294263; border-radius: 5px 5px 1px 1px; }

  .gap {
    position: absolute;
    height: 1px;
    background: #e6b450;
    opacity: 0.55;
  }

  .g1 { bottom: 24px;  left: 3px;  width: 174px; }
  .g2 { bottom: 48px;  left: 15px; width: 150px; }
  .g3 { bottom: 72px;  left: 27px; width: 126px; }
  .g4 { bottom: 96px;  left: 39px; width: 102px; }
  .g5 { bottom: 120px; left: 51px; width: 78px;  }

  .peak-dot {
    position: absolute;
    bottom: 140px;
    left: 86px;
    width: 8px;
    height: 8px;
    background: #e6b450;
    border-radius: 50%;
    box-shadow: 0 0 10px #e6b450, 0 0 20px rgba(230,180,80,0.25);
  }

  /* === WORDMARK === */
  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: 8px;
    color: #8b949e;
    text-transform: lowercase;
    margin-bottom: 12px;
  }

  .wordmark .first {
    color: #e6b450;
  }

  /* === TAGLINE === */
  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    color: #30363d;
    text-transform: uppercase;
  }

  /* === SEPARATOR === */
  .sep {
    width: 60px;
    height: 1px;
    background: #1c2128;
    margin: 36px 0;
  }

  /* === HORIZONTAL LOCKUP === */
  .h-lockup {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .h-icon {
    position: relative;
    width: 48px;
    height: 40px;
    flex-shrink: 0;
  }

  .h-word {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 5px;
    color: #8b949e;
  }
  .h-word .first { color: #e6b450; }
</style>
</head>
<body>
<div class="canvas">
  <div class="icon">
    <div class="layer l1"></div>
    <div class="layer l2"></div>
    <div class="layer l3"></div>
    <div class="layer l4"></div>
    <div class="layer l5"></div>
    <div class="layer l6"></div>
    <div class="gap g1"></div>
    <div class="gap g2"></div>
    <div class="gap g3"></div>
    <div class="gap g4"></div>
    <div class="gap g5"></div>
    <div class="peak-dot"></div>
  </div>

  <div class="wordmark"><span class="first">b</span>ukit</div>
  <div class="tagline">&middot; static site engine &middot;</div>

  <div class="sep"></div>

  <div class="h-lockup">
    <div class="h-icon">
      <div style="position:absolute;bottom:0;left:0;width:48px;height:7px;background:#131f2e;border-radius:2px 2px 0 0;"></div>
      <div style="position:absolute;bottom:6px;left:4px;width:40px;height:7px;background:#182638;border-radius:2px 2px 0 0;"></div>
      <div style="position:absolute;bottom:12px;left:8px;width:32px;height:7px;background:#1c2d42;border-radius:2px 2px 0 0;"></div>
      <div style="position:absolute;bottom:18px;left:12px;width:24px;height:7px;background:#20344d;border-radius:2px 2px 0 0;"></div>
      <div style="position:absolute;bottom:24px;left:16px;width:16px;height:7px;background:#253b58;border-radius:2px 2px 0 0;"></div>
      <div style="position:absolute;bottom:30px;left:20px;width:8px;height:7px;background:#294263;border-radius:2px 2px 0 0;"></div>
      <div style="position:absolute;bottom:7px;left:1px;width:46px;height:1px;background:#e6b450;opacity:0.5;"></div>
      <div style="position:absolute;bottom:14px;left:5px;width:38px;height:1px;background:#e6b450;opacity:0.5;"></div>
      <div style="position:absolute;bottom:21px;left:9px;width:30px;height:1px;background:#e6b450;opacity:0.5;"></div>
      <div style="position:absolute;bottom:28px;left:13px;width:22px;height:1px;background:#e6b450;opacity:0.5;"></div>
      <div style="position:absolute;bottom:35px;left:17px;width:14px;height:1px;background:#e6b450;opacity:0.5;"></div>
      <div style="position:absolute;bottom:37px;left:22px;width:4px;height:4px;background:#e6b450;border-radius:50%;box-shadow:0 0 5px #e6b450,0 0 10px rgba(230,180,80,0.2);"></div>
    </div>
    <div class="h-word"><span class="first">b</span>ukit</div>
  </div>
</div>
</body>
</html>
