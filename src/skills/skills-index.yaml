# Loading chains for common workflows
workflows:
  create_new_site:
    description: "Create a new Bukit site from scratch"
    chain: [using-bukit, bukit-cli-reference, bukit-config, bukit-theme, bukit-templating]

  configure_notion:
    description: "Configure Notion as content source"
    chain: [using-bukit, bukit-notion, bukit-config, bukit-cli-reference]

  customize_routing:
    description: "Customize URL routing and list pages"
    chain: [using-bukit, bukit-routing, bukit-config, bukit-templating]

  debug_build:
    description: "Debug build or plugin issues"
    chain: [using-bukit, bukit-plugins-debug, bukit-config, bukit-cli-reference]

  deploy_site:
    description: "Deploy site to GitHub Pages"
    chain: [using-bukit, bukit-deploy, bukit-config, bukit-cli-reference]

  configure_seo:
    description: "Configure SEO and run audits"
    chain: [using-bukit, bukit-seo, bukit-config, bukit-cli-reference]

  setup_geo:
    description: "Set up GEO for AI search engines"
    chain: [using-bukit, bukit-geo, bukit-config, bukit-cli-reference]

  clone_website:
    description: "Clone a website's design"
    chain: [using-bukit, bukit-clone, bukit-theme, bukit-cli-reference]

  create_theme:
    description: "Create a custom theme (interactive)"
    chain: [using-bukit, bukit-theme, bukit-cli-reference]

  install_theme:
    description: "Install a theme from community registry"
    chain: [using-bukit, bukit-theme, bukit-cli-reference]

  build_design_system:
    description: "Build a consistent design system"
    chain: [using-bukit, bukit-design-tokens, bukit-theme, bukit-config]

  generate_templates_from_schema:
    description: "Generate templates from content schema"
