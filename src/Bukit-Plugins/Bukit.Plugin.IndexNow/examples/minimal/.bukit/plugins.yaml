version: 1
plugins:
  indexnow:
    enabled: true
    source: plugins/indexnow
    exposeCommands:
      - indexnow
    allowInCi: false
    permissions:
      fileSystem:
        read:
          - .
        write:
          - .cache/indexnow
          - ./dist
      network: true
      environment:
        read:
          - INDEXNOW_KEY
    timeout:
      handshakeMs: 5000
      manifestMs: 5000
      invokeMs: 300000
