{% layout "layouts/base.html" %}

<header class="page-header">
  <h1>{{ page.title | html.escape }}</h1>
</header>

<div class="search-form">
  <input id="search-query" type="search" placeholder="{{ site.params.labels.search_placeholder | object.default "Search posts and pages" | html.escape }}" aria-label="{{ site.params.labels.search | object.default "Search" | html.escape }}" />
  <button id="search-button" type="button">{{ site.params.labels.search | object.default "Search" | html.escape }}</button>
</div>
<ul id="search-results" class="card-list"></ul>

<script>
const queryInput = document.getElementById('search-query');
const searchButton = document.getElementById('search-button');
const resultsElement = document.getElementById('search-results');
const untitledLabel = "{{ site.params.labels.untitled | object.default "Untitled" | string.escape | string.replace '<' '\\u003C' }}";
const noResultsLabel = "{{ site.params.labels.no_results | object.default "No results" | string.escape | string.replace '<' '\\u003C' }}";
const siteLanguage = "{{ site.language | string.escape | string.replace '<' '\\u003C' }}".toLowerCase();

// The root merged index holds every language; keep the records of this page's
// language. Records marked "und" (no language) always match.
function matchesSiteLanguage(item) {
  const language = (item.language || 'und').toLowerCase();
  return siteLanguage === '' || language === 'und' || language === siteLanguage;
}

function appendResult(item) {
  const li = document.createElement('li');
  li.className = 'card';
  const title = document.createElement('h2');
  title.className = 'card-title';
  const link = document.createElement('a');
  link.href = item.url || '#';
  link.textContent = item.title || untitledLabel;
  title.appendChild(link);
  li.appendChild(title);
  const summary = item.snippet || item.summary;
  if (summary) {
    const p = document.createElement('p');
    p.className = 'summary';
    p.textContent = summary;
    li.appendChild(p);
  }
  resultsElement.appendChild(li);
}

async function runSearch() {
  const keyword = (queryInput.value || '').trim().toLowerCase();
  {{ base_url = site.base_url }}
  {{ if base_url == "/" }}{{ base_url = "" }}{{ end }}
  const response = await fetch('{{ base_url }}/search.json');
  const items = await response.json();
  resultsElement.innerHTML = '';
  const matches = items
    .filter(matchesSiteLanguage)
    .filter(item => keyword === '' ||
      (item.title || '').toLowerCase().includes(keyword) ||
      (item.summary || '').toLowerCase().includes(keyword) ||
      (item.snippet || '').toLowerCase().includes(keyword));
  matches.forEach(appendResult);
  if (matches.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'search-empty';
    empty.textContent = noResultsLabel;
    resultsElement.appendChild(empty);
  }
}

searchButton.addEventListener('click', runSearch);
queryInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') runSearch();
});
</script>
