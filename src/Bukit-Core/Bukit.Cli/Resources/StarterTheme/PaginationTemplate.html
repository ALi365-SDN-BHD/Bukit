{% layout "layouts/base.html" %}

<header class="page-header">
  <p class="eyebrow">Archive</p>
  <h1>{{ page.title }}</h1>
  {{ if collection }}
    <p class="meta">Collection: {{ collection.key }}</p>
  {{ end }}
</header>

<ul class="card-list">
{{ for item in items }}
  {{ include "partials/list-card.html" }}
{{ end }}
</ul>

{{ include "partials/pagination-nav.html" }}
