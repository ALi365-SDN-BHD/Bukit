<footer class="site-footer">
  <div class="footer-inner">
    <span>
      {{ if site.params && site.params.footer_text }}
        {{ site.params.footer_text | html.escape }}
      {{ else }}
        {{ site.title | html.escape }}
      {{ end }}
    </span>
    <small>{{ site.params.labels.powered_by | object.default "Powered by" | html.escape }} <a href="https://github.com/ALi365-SDN-BHD/Bukit" target="_blank" rel="noopener">bukit</a></small>
  </div>
</footer>
