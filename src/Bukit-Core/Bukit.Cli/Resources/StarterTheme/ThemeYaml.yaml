name: starter
display_name: Starter
version: 1.0.0
engine: bukit
description: Default starter theme for bukit
capabilities:
  seo: true
  taxonomy: true
  search: true
templates:
  home:
    template: pages/index.html
    required: true
  page:
    template: pages/page.html
    accepts:
      collection: page
  post:
    template: pages/post.html
    accepts:
      collection: post
  detail:
    template: pages/page.html
    accepts:
      kind: detail
  list:
    template: pages/list.html
    accepts:
      kind: list
  pagination:
    template: pages/pagination.html
    accepts:
      kind: pagination
  archive:
    template: pages/page.html
    accepts:
      kind: archive
  taxonomy_index:
    template: pages/taxonomy-index.html
    accepts:
      kind: taxonomy_index
  taxonomy_term:
    template: pages/taxonomy-term.html
    accepts:
      kind: taxonomy_term
assets:
  css:
    - assets/style.css
