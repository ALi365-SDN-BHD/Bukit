name: starter
version: 1.0.0
description: Default starter theme for bukit
author: Bukit
license: MIT
tags: [starter, minimal, blog]
templates:
  home:
    template: pages/index.html
    required: true
  page:
    template: pages/page.html
    accepts:
      type: page
  post:
    template: pages/post.html
    accepts:
      type: post
  detail:
    template: pages/page.html
    accepts:
      kind: detail
  list:
    template: pages/list.html
    accepts:
      kind: list
  pagination:
    template: pages/pagination.html
    accepts:
      kind: pagination
  archive:
    template: pages/page.html
    accepts:
      kind: archive
  taxonomy_index:
    template: pages/taxonomy-index.html
    accepts:
      kind: taxonomy_index
  taxonomy_term:
    template: pages/taxonomy-term.html
    accepts:
      kind: taxonomy_term
params:
  - key: brand
    label: Site Brand
    type: string
    default: My Site
  - key: primary_color
    label: Primary Color
    type: color
    default: "#0b5fff"
  - key: accent_color
    label: Accent Color
    type: color
    default: "#0f7b6c"
  - key: footer_text
    label: Footer Text
    type: string
    default: My Site
