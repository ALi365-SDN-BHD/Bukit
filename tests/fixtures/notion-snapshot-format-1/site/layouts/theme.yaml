name: notion-snapshot-format-1
version: 1.0.0
engine: bukit
min_engine_version: 0.3.0
description: Local theme for the Notion snapshot format-1 compatibility fixture.

templates:
  home:
    template: pages/index.html
    required: true
  post:
    template: pages/post.html
    accepts:
      collection: post
  person:
    template: pages/person.html
    accepts:
      collection: person
  list:
    template: pages/list.html
    accepts:
      kind: list
  taxonomy_index:
    template: pages/taxonomy-index.html
    accepts:
      kind: taxonomy_index
  taxonomy_term:
    template: pages/taxonomy-term.html
    accepts:
      kind: taxonomy_term
