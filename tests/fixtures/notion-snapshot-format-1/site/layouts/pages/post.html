{% layout "layouts/base.html" %}
<article>
<h1>{{ page.title }}</h1>
<p data-summary>{{ page.fields.summary.value }}</p>
<p data-tags>{{ for tag in page.fields.tags.value }}{{ tag }};{{ end }}</p>
<p data-author>{{ for author in page.fields.author.value }}{{ author.title }};{{ end }}</p>
<!--notion-body-->{{ page.content }}<!--/notion-body-->
</article>
