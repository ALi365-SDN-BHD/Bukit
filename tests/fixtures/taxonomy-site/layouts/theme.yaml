name: fixture-taxonomy
version: 1.0.0
engine: bukit
min_engine_version: 0.3.0
description: Local theme declaration for taxonomy fixture smoke checks.

templates:
  home:
    template: pages/index.html
    required: true
  page:
    template: pages/page.html
    accepts:
      collection: page
  taxonomy_index:
    template: pages/taxonomy-index.html
    accepts:
      kind: taxonomy_index
  taxonomy_term:
    template: pages/taxonomy-term.html
    accepts:
      kind: taxonomy_term
