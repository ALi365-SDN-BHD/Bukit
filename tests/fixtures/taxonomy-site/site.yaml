site:
  name: taxonomy-test
  title: Taxonomy Test
  language: en
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
content:
  provider: markdown
  markdown:
    dir: content
    defaultType: page
build:
  output: dist
  clean: false
theme:
  layouts: layouts
taxonomy:
  itemFields:
    - date
  templates:
    categories:
      termTemplate: pages/taxonomy-term.html
