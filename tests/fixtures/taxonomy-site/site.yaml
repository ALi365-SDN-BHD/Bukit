site:
  name: taxonomy-test
  title: Taxonomy Test
  language: en
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
content:
  sources:
    - type: markdown
      markdown:
        dir: content
  markdown:
    dir: content
build:
  output: dist
  clean: false
theme:
  layouts: layouts
taxonomy:
  template: pages/taxonomy-term.html
  indexTemplate: pages/taxonomy-term.html
  termTemplate: pages/taxonomy-term.html
  itemFields:
    - date
  templates:
    categories:
      termTemplate: pages/taxonomy-term.html
