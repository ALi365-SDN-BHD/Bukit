site:
  name: taxonomy-test
  title: Taxonomy Test
  language: en
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
content:
  sources:
    - type: markdown
      name: pages
      collection: page
      markdown:
        dir: content
build:
  output: dist
  clean: false
theme:
  layouts: layouts
taxonomy:
  itemFields:
    - date
  kinds:
    - key: categories
      kind: categories
      indexTemplate: pages/taxonomy-index.html
      termTemplate: pages/taxonomy-term.html
