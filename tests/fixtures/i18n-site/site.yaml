site:
  name: i18n-test
  title: I18N Test
  languages:
    - en
    - zh-CN
  defaultLanguage: en
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
  sitemapMode: merged
  search:
    mode: merged
content:
  sources:
    - type: markdown
      name: pages
      collection: page
      markdown:
        dir: content
build:
  output: dist
  clean: false
theme:
  layouts: layouts
