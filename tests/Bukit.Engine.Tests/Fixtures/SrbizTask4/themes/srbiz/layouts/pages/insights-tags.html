{% layout "layouts/base.html" %}
{{ base_url = site.base_url }}{{ if base_url == "/" }}{{ base_url = "" }}{{ end }}
<main id="main-content" tabindex="-1">
  <section class="page-hero"><div class="container"><div class="breadcrumb"><a href="{{ base_url }}/">首页</a> / <a href="{{ base_url }}/insights/">商务资讯</a> / 资讯标签</div><h1>资讯标签</h1><p>按标签浏览商务资讯。</p></div></section>
  <section class="section" aria-labelledby="tags-index-list-title"><div class="container"><h2 id="tags-index-list-title" class="visually-hidden">资讯标签列表</h2><div class="tag-index-grid">{{ for tag in site.data.taxonomy.tags.terms }}<article class="tag-index-card"><h3><a href="{{ base_url }}{{ tag.url }}">{{ tag.title }}</a></h3><span>{{ tag.count }} 篇</span></article>{{ end }}</div></div></section>
</main>
