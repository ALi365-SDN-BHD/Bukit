{% layout "layouts/base.html" %}
{{ base_url = site.base_url }}{{ if base_url == "/" }}{{ base_url = "" }}{{ end }}
<main id="main-content" tabindex="-1"><section class="page-hero"><div class="container"><h1>{{ page.title }}</h1><p>{{ page.summary }}</p></div></section><section class="section"><div class="container">{{ for item in pages }}<article><h2><a href="{{ base_url }}{{ item.url }}">{{ item.title }}</a></h2>{{ if item.summary }}<p>{{ item.summary }}</p>{{ end }}</article>{{ end }}</div></section></main>
