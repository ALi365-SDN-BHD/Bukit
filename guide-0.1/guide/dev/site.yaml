site:
  name: starter
  title: Bukit Starter
  baseUrl: /
  language: zh-CN
  pluginFailMode: strict
  plugins:
    path-report:
      enabled: true
      options:
        wechatMaterialUpload:
          enabled: false
          appIdEnv: WECHAT_APP_ID
          appSecretEnv: WECHAT_APP_SECRET
          file: assets/imgs/default.png
          type: image
  timezone: Asia/Shanghai
  autoSummary: true
  autoSummaryMaxLength: 200
content:
  sources:
    - name: pages
      mode: content
      collection: page
      markdown:
        dir: content
build:
  output: dist
  clean: true
theme:
  layouts: layouts
  assets: assets
  static: static
  name: alt
logging:
  level: info
...
