schema: spec-driven
context: |
  Bukit 是企业内部内容发布 Core；SRBiz-bukit 是独立网站仓库。
  当前规范记录在 openspec/specs/，已完成变更记录在 openspec/changes/archive/。
  align-srbiz-publishing-contracts 已归档；其 Core 范围仅为架构文档，站点实现保持隔离。
  不隐含授权 commit、push、deploy、Notion 写入或通知。
rules:
  proposal:
    - 明确跨仓影响、用户批准范围和非目标。
  specs:
    - 每个 requirement 使用 SHALL 或 MUST，并至少包含一个 WHEN/THEN Scenario。
  tasks:
    - tasks.md 是唯一实施清单；只有具备实际证据才勾选完成。
