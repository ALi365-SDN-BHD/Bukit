site:
  name: blog-site
  title: Blog Example
  url: https://example.com
  baseUrl: /
  language: en
  seo:
    renderMode: inject
  autoSummary: true
  collections:
    post:
      permalink: /blog/{slug}/
      template: pages/post.html
      listRoute: /blog/
      listTemplate: pages/list.html
      pagination:
        enabled: true
        pageSize: 2
      output:
        rss: true
        sitemap: true
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
  timezone: Asia/Shanghai
content:
  sources:
    - type: markdown
      markdown:
        dir: content
build:
  output: dist
  clean: true
theme:
  layouts: layouts
taxonomy:
  template: pages/taxonomy-term.html
  indexTemplate: pages/taxonomy-term.html
  termTemplate: pages/taxonomy-term.html
  itemFields:
    - date
  templates:
    categories:
      termTemplate: pages/taxonomy-term.html
logging:
  level: info
