{% layout "layouts/base.html" %}
<h1>Blog</h1>
{{ items = page.fields.items.value }}
{{ pagination = page.fields.pagination.value }}
{{ for p in items }}
<article>
<h2><a href="{{ p.url }}">{{ p.title }}</a></h2>
<time>{{ p.publish_date }}</time>
<p>{{ p.summary }}</p>
</article>
{{ end }}
<nav>
{{ if pagination.has_prev }}<a href="{{ site.base_url }}blog/page/{{ pagination.prev_page }}/">Previous</a>{{ end }}
{{ if pagination.has_next }}<a href="{{ site.base_url }}blog/page/{{ pagination.next_page }}/">Next</a>{{ end }}
</nav>
