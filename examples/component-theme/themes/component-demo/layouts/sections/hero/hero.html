<section class="hero">
  <div class="hero-content">
    {{ if section.props.eyebrow }}
    <p class="hero-eyebrow">{{ section.props.eyebrow }}</p>
    {{ end }}
    <h2 class="hero-title">{{ section.props.title }}</h2>
    {{ if section.props.subtitle }}
    <p class="hero-subtitle">{{ section.props.subtitle }}</p>
    {{ end }}
    {{ if section.props.primary_button_text }}
    <a href="{{ section.props.primary_button_url }}" class="btn-primary">
      {{ section.props.primary_button_text }}
    </a>
    {{ end }}
  </div>
</section>
