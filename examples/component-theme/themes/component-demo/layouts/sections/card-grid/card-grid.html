<section class="card-grid">
  {{ if section.props.title }}
  <h2 class="grid-title">{{ section.props.title }}</h2>
  {{ end }}
  <div class="grid-items">
    {{ for card in items }}
      <article class="card">
        <h3 class="card-title">
          <a href="{{ card.url }}">{{ card.title }}</a>
        </h3>
        {{ if card.summary }}
        <p class="card-summary">{{ card.summary }}</p>
        {{ end }}
        <time class="card-date">{{ card.publish_date_formatted }}</time>
      </article>
    {{ end }}
  </div>
</section>
