site:
  name: component-demo
  title: Bukit Component Theme Demo
  url: https://example.com
  collections:
    page:
      permalink: /{slug}/
      template: pages/home.html
    posts:
      permalink: /posts/{slug}/
      template: pages/page.html
      listRoute: /posts/
      listTemplate: pages/list.html

content:
  sources:
    - type: markdown
      markdown:
        dir: content

taxonomy:
  template: pages/taxonomy-term.html
  indexTemplate: pages/taxonomy-term.html
  termTemplate: pages/taxonomy-term.html

theme:
  name: component-demo
  componentValidation: warn

build:
  output: dist
