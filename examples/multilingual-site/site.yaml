site:
  name: multilingual-site
  title: Multilingual Example
  url: https://example.com
  baseUrl: /
  languages:
    - en
    - zh-CN
  defaultLanguage: en
  seo:
    renderMode: inject
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
content:
  provider: markdown
  markdown:
    dir: content
build:
  output: dist
  clean: true
  listPageContentMode: auto
theme:
  layouts: layouts
logging:
  level: info
