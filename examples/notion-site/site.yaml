site:
  name: notion-site
  title: Notion Content Example
  url: https://example.com
  baseUrl: /
  language: en
  seo:
    renderMode: inject
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
content:
  sources:
    - type: notion
      name: pages
      collection: page
      notion:
        tokenEnv: BUKIT_NOTION_TOKEN
        databaseIdEnv: BUKIT_NOTION_DATABASE_ID
build:
  output: dist
  clean: true
theme:
  layouts: layouts
logging:
  level: info
