site:
  name: docs-site
  title: Documentation Example
  url: https://example.com
  baseUrl: /
  language: en
  seo:
    renderMode: inject
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
content:
  provider: markdown
  markdown:
    dir: content
build:
  output: dist
  clean: true
theme:
  layouts: layouts
logging:
  level: info
