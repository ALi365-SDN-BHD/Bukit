site:
  name: silkroad-biz23
  title: Silkroad Biz23
  description: Build-time business intelligence and company directory example.
  url: https://silkroad.example
  baseUrl: /
  language: en
  collections:
    insight:
      permalink: /insights/{slug}/
      template: pages/insight.html
      listRoute: /insights/
      listTemplate: pages/insight-list.html
      pagination:
        enabled: true
        pageSize: 2
        urlPattern: page/{page}/
    company:
      permalink: /companies/{slug}/
      template: pages/company.html
      listRoute: /companies/
      listTemplate: pages/company-list.html
      pagination:
        enabled: true
        pageSize: 2
        urlPattern: page/{page}/
content:
  sources:
    - type: markdown
      name: insights
      mode: content
      collection: insight
      markdown:
        dir: content/insights
    - type: markdown
      name: companies
      mode: content
      collection: company
      markdown:
        dir: content/companies
build:
  output: dist
  clean: true
theme:
  name: silkroad_biz23
taxonomy:
  outputMode: pages
  pageSize: 2
  itemFields:
    - categories
    - summary
  kinds:
    - key: categories
      kind: category
      title: Insight Categories
      singularTitlePrefix: Category
      routePrefix: /insights/category
      termTemplate: pages/insight-list.html
logging:
  level: info
