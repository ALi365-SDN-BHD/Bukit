site:
  name: starter-i18n-merged
  title: Bukit Starter (i18n merged)
  baseUrl: /
  language: zh-CN
  languages:
    - zh-CN
    - en-US
  defaultLanguage: zh-CN
  sitemapMode: merged
  timezone: Asia/Shanghai
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false

content:
  provider: markdown
  markdown:
    dir: content-i18n

build:
  output: dist_i18n_merged
  clean: true

theme:
  layouts: layouts
  assets: assets
  static: static

logging:
  level: info
