site:
  name: starter-blog
  title: Bukit Starter (blog site)
  baseUrl: /
  language: zh-CN
  timezone: Asia/Shanghai
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false
    about:
      permalink: /{slug}/
      template: pages/page.html
      output:
        rss: false
        sitemap: true
        archive: false

content:
  sources:
    - type: markdown
      name: pages
      mode: content
      collection: page
      markdown:
        dir: content

build:
  output: dist_blog
  clean: true

theme:
  layouts: layouts
  assets: assets
  static: static

logging:
  level: info
