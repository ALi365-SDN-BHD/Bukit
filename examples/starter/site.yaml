site:
  name: starter
  title: Bukit Starter
  description: A content-first starter theme for Markdown and Notion sites.
  url: https://example.com
  baseUrl: /
  language: zh-CN
  seo:
    renderMode: inject
  pluginFailMode: strict
  externalPlugins:
    sample-wasm:
      enabled: false
      runtime: process
      entry: dotnet
      hooks: [after-build]
      capabilities: [emit-outputs]
      timeoutMs: 5000
      options:
        processArgs:
          positionals:
            - plugins/ProtocolEchoPlugin.dll
            - success
  timezone: Asia/Shanghai
  autoSummary: true
  autoSummaryMaxLength: 200
  collections:
    post:
      permalink: /blog/{slug}/
      template: pages/post.html
      listRoute: /blog/
      pagination:
        enabled: true
        pageSize: 10
      output:
        rss: true
        sitemap: true
        archive: true
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false
    about:
      permalink: /{slug}/
      template: pages/about.html
      output:
        rss: false
        sitemap: true
        archive: false
content:
  sources:
    - type: markdown
      name: posts
      mode: content
      collection: post
      markdown:
        dir: content
        includePaths:
          - hello-world
    - type: markdown
      name: pages
      mode: content
      collection: page
      markdown:
        dir: content
        includePaths:
          - about
  modelSchema:
    requireSummary: true
    requireAuthor: true
    requireUpdatedAt: true
build:
  output: dist
  clean: true
  listPageContentMode: auto
theme:
  layouts: layouts
  assets: assets
  static: assets
  params:
    brand: Bukit Starter
    footer_text: Starter content site
    github_url: https://github.com/ALi365-SDN-BHD/Bukit
    hero_eyebrow: Starter theme
    featured_section_title: Featured
    latest_content_title: Latest content
    search_hint: Search generated titles, summaries, and snippets.
    analytics_script_base: https://www.googletagmanager.com/gtag/js
    pagination_prev_label: ←
    pagination_next_label: →
taxonomy:
  itemFields:
    - cover
    - image
    - date
  templates:
    categories:
      termTemplate: pages/taxonomy-term.html
logging:
  level: info
...
