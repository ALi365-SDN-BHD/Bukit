  title: Bukit Starter
  baseUrl: /
  language: zh-CN
  pluginFailMode: strict
  timezone: Asia/Shanghai
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false
    about:
      permalink: /{slug}/
      template: pages/page.html
      output:
        rss: false
        sitemap: true
        archive: false
content:
