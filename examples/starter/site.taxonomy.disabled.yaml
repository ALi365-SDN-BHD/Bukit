site:
  name: starter
  title: Bukit Starter
  baseUrl: /
  language: zh-CN
  pluginFailMode: strict
  timezone: Asia/Shanghai
  plugins:
    taxonomy:
      enabled: false
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false
    about:
      permalink: /{slug}/
      template: pages/page.html
      output:
        rss: false
        sitemap: true
        archive: false
content:
  sources:
    - type: markdown
      name: pages
      mode: content
      collection: page
      markdown:
        dir: content
build:
  output: dist_taxonomy_disabled
  clean: true
theme:
  layouts: layouts
  assets: assets
  static: static
  name: alt
  params:
    brand: Alt Theme
    github_url: https://github.com/ALi365-SDN-BHD/Bukit
    empty_result_text: 没有找到你要的结果。
logging:
  level: info
...
