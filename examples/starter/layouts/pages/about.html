{% layout "layouts/base.html" %}

<article class="article">
  <header class="article-header">
    <p class="eyebrow">About</p>
    <h1>{{ page.title }}</h1>
    {{ if page.summary }}<p class="article-summary">{{ page.summary }}</p>{{ end }}
  </header>
  <div class="content">
    {{ page.content }}
  </div>
</article>
