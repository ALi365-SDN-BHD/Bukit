{% layout "layouts/base.html" %}

<header class="page-header">
  <p class="eyebrow">Collection</p>
  <h1>{{ page.title }}</h1>
  {{ if page.summary }}<p>{{ page.summary }}</p>{{ end }}
</header>

<ul class="card-list">
{{ for p in pages }}
  {{ item = p }}
  {{ include "partials/list-card.html" }}
{{ end }}
</ul>
