{{ if site.analytics && site.analytics.enabled && site.analytics.googleAnalyticsId }}
  <script async src="{{ site.params.analytics_script_base }}?id={{ site.analytics.googleAnalyticsId }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.analytics.googleAnalyticsId }}');
  </script>
{{ end }}
