name: alt
version: 1.0.0
description: Alternate starter theme for smoke tests
author: Bukit
license: MIT
tags: [starter, alternate]
templates:
  home:
    template: pages/index.html
    required: true
  page:
    template: pages/page.html
    accepts:
      collection: page
  post:
    template: pages/post.html
    accepts:
      collection: post
  about:
    template: pages/page.html
    accepts:
      collection: about
  detail:
    template: pages/page.html
    accepts:
      kind: detail
  list:
    template: pages/list.html
    accepts:
      kind: list
  pagination:
    template: pages/list.html
    accepts:
      kind: pagination
  taxonomy_index:
    template: pages/tag.html
    accepts:
      kind: taxonomy_index
  taxonomy_term:
    template: pages/tag.html
    accepts:
      kind: taxonomy_term
params:
  - key: brand
    label: Site Brand
    type: string
    default: Bukit Starter
