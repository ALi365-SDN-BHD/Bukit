site:
  name: starter
  title: Bukit Starter
  baseUrl: /
  language: zh-CN
  timezone: Asia/Shanghai
  collections:
    post:
      permalink: /blog/{slug}/
      template: pages/post.html
      listRoute: /blog/
      pagination:
        enabled: true
        pageSize: 10
      output:
        rss: true
        sitemap: true
        archive: true
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false
content:
  provider: sources
  sources:
    - type: markdown
      name: content
      mode: content
      collection: page
      markdown:
        dir: content
        defaultType: page
    - type: markdown
      name: modules
      mode: data
      markdown:
        dir: data
        defaultType: module
build:
  output: dist
  clean: true
theme:
  layouts: layouts
  assets: assets
  static: static
  name: alt
logging:
  level: info
...

