site:
  name: starter
  title: Bukit Starter (i18n SEO)
  url: https://example.com
  baseUrl: /
  languages:
    - zh-CN
    - en-US
  defaultLanguage: zh-CN
  sitemapMode: merged
  timezone: Asia/Shanghai
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      listTemplate: pages/list.html
      output:
        rss: true
        sitemap: true
        archive: false
content:
  sources:
    - type: markdown
      name: content
      mode: content
      collection: page
      markdown:
        dir: content
    - type: markdown
      name: modules
      mode: data
      markdown:
        dir: data
        defaultType: module
build:
  output: .bukit_test/dist
  clean: false
theme:
  layouts: layouts
  assets: assets
  static: static
  name: seo-best-practice
logging:
  level: info
...
