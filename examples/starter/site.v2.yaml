site:
  name: starter
  title: Bukit Starter (v2 sources)
  baseUrl: /
  language: zh-CN
  timezone: Asia/Shanghai
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false

content:
  sources:
    - type: markdown
      markdown:
        dir: content
      dir: content
      collection: page
    - type: markdown
      markdown:
        dir: content
      dir: content_extra
      collection: page

build:
  output: dist
  clean: false

theme:
  layouts: layouts
  assets: assets
  static: static

logging:
  level: info
