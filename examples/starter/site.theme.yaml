site:
  name: starter-theme
  title: Bukit Starter (theme alt)
  baseUrl: /
  language: zh-CN
  timezone: Asia/Shanghai
  collections:
    page:
      permalink: /pages/{slug}/
      template: pages/page.html
      listRoute: /pages/
      output:
        rss: false
        sitemap: true
        archive: false

content:
  sources:
    - type: markdown
      name: pages
      mode: content
      collection: page
      markdown:
        dir: content

build:
  output: dist_theme
  clean: false

theme:
  name: alt
  params:
    brand: ALT THEME
    github_url: https://github.com/ALi365-SDN-BHD/Bukit
    empty_result_text: 没有找到你要的结果。

logging:
  level: info
