site:
  name: corporate-site
  title: Acme Corporation
  url: https://example.com
  baseUrl: /
  language: en
  seo:
    renderMode: inject
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
content:
  sources:
    - type: markdown
      name: pages
      collection: page
      markdown:
        dir: content
build:
  output: dist
  clean: true
theme:
  layouts: layouts
logging:
  level: info
