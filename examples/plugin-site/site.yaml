site:
  name: plugin-site
  title: Plugin Example
  url: https://example.com
  baseUrl: /
  language: en
  plugins:
    path-report:
      enabled: true
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
content:
  sources:
    - type: markdown
      name: pages
      collection: page
      markdown:
        dir: content
build:
  output: dist
  clean: true
theme:
  layouts: layouts
logging:
  level: info
