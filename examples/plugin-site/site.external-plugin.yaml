site:
  name: plugin-site-external
  title: External Plugin Example
  url: https://example.com
  baseUrl: /
  language: en
  externalPlugins:
    hello-derive:
      runtime: process
      entry: plugins/hello-derive.js
      hooks: [derive-pages]
      capabilities: [derive-pages]
      timeoutMs: 5000
  collections:
    page:
      permalink: /{slug}/
      template: pages/page.html
      output:
        sitemap: true
content:
  provider: markdown
  markdown:
    dir: content
build:
  output: dist
  clean: true
theme:
  layouts: layouts
logging:
  level: info
