<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="180" height="180" rx="24" fill="url(#bg)"/>

  <g transform="translate(0, 24)">
    <!-- Layer 1 -->
    <rect x="18" y="132" width="144" height="18" rx="4" fill="#131f2e"/>
    <rect x="20" y="150" width="140" height="1" fill="#e6b450" opacity="0.5"/>

    <!-- Layer 2 -->
    <rect x="28" y="114" width="124" height="18" rx="4" fill="#182638"/>
    <rect x="30" y="132" width="120" height="1" fill="#e6b450" opacity="0.5"/>

    <!-- Layer 3 -->
    <rect x="38" y="96" width="104" height="18" rx="4" fill="#1c2d42"/>
    <rect x="40" y="114" width="100" height="1" fill="#e6b450" opacity="0.5"/>

    <!-- Layer 4 -->
    <rect x="48" y="78" width="84" height="18" rx="4" fill="#20344d"/>
    <rect x="50" y="96" width="80" height="1" fill="#e6b450" opacity="0.5"/>

    <!-- Layer 5 -->
    <rect x="58" y="60" width="64" height="18" rx="4" fill="#253b58"/>
    <rect x="60" y="78" width="60" height="1" fill="#e6b450" opacity="0.5"/>

    <!-- Layer 6 -->
    <rect x="68" y="42" width="44" height="18" rx="4" fill="#294263"/>
    <rect x="70" y="60" width="40" height="1" fill="#e6b450" opacity="0.5"/>

    <!-- Layer 7 -->
    <rect x="78" y="24" width="24" height="18" rx="4" fill="#2e4a6e"/>

    <!-- Peak -->
    <circle cx="90" cy="20" r="3.5" fill="#e6b450" filter="url(#glow)" opacity="0.9"/>
  </g>
</svg>
