<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: left-to-right collapsible tree; one hue per top-level branch, neutrals tinted toward blue-grey */
:root{
  --bg:#f5f6f8; --fg:#1b2230; --muted:#5d6779; --line:#b9c0cc; --panel:#ffffff; --edge:#d9dde5;
  --nl:90%; --ns:62%; --nt:#1b2230; --rootbg:#1b2230; --roottxt:#f5f6f8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --fg:#e6e9ef; --muted:#9aa4b5; --line:#3a4354; --panel:#1a202a; --edge:#2b3340;
  --nl:24%; --ns:45%; --nt:#e6e9ef; --rootbg:#e6e9ef; --roottxt:#12161d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --fg:#e6e9ef; --muted:#9aa4b5; --line:#3a4354; --panel:#1a202a; --edge:#2b3340;
  --nl:24%; --ns:45%; --nt:#e6e9ef; --rootbg:#e6e9ef; --roottxt:#12161d; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{max-width:900px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
p.sub{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.bar button,.bar input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:6px 12px}
.bar button{cursor:pointer}.bar button:hover{border-color:var(--muted)}
.bar input{min-width:0;flex:1 1 180px;max-width:280px}
button:focus-visible,input:focus-visible,.nd:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.wrap{overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:18px 16px 22px}
ul.t,ul.kids{list-style:none;margin:0;padding:0}
ul.t>li{display:flex;align-items:center;width:max-content}
li{position:relative;display:flex;align-items:center}
ul.kids{display:flex;flex-direction:column;margin-left:30px;position:relative}
ul.kids::before{content:"";position:absolute;left:-15px;top:50%;width:15px;border-top:1.5px solid var(--line)}
ul.kids>li{padding:3px 0}
ul.kids>li::before{content:"";position:absolute;left:-15px;top:50%;width:15px;border-top:1.5px solid var(--line)}
ul.kids>li::after{content:"";position:absolute;left:-15px;top:0;bottom:0;border-left:1.5px solid var(--line)}
ul.kids>li:first-child::after{top:50%}ul.kids>li:last-child::after{bottom:50%}ul.kids>li:only-child::after{display:none}
.nd{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:7px;padding:4px 10px;
  background:hsl(var(--h,215) var(--ns) var(--nl));color:var(--nt);border:1px solid hsl(var(--h,215) 40% 50% / .45)}
.nd.has{cursor:pointer;font-weight:600}
.nd .c{font-size:11px;font-weight:400;opacity:.7;font-variant-numeric:tabular-nums}
.nd .a{font-size:10px;display:inline-block;transition:transform .12s}
.open>.nd .a{transform:rotate(90deg)}
.nd.leaf{background:transparent;border-color:transparent;padding:3px 8px;font-weight:400}
.nd.leaf em{font-style:normal;color:var(--muted);font-size:12px}
.nd.root{background:var(--rootbg);color:var(--roottxt);font-size:17px;padding:10px 18px;border-color:transparent}
.nd.hit{outline:2px solid #f59e0b;outline-offset:1px}
li:not(.open)>ul.kids{display:none}
.legend{margin-top:12px;color:var(--muted);font-size:12px;max-width:900px}
@media (prefers-reduced-motion:reduce){.nd .a{transition:none}}
</style>

<header>

const root=document.getElementById('root');
let hue=0;
function build(n,depth,h){
  const li=document.createElement('li'); if(h!==undefined) li.style.setProperty('--h',h);
  const o=typeof n==='string'?{l:n,k:[]}:n; const has=o.k.length>0;
  const d=document.createElement('span'); d.className='nd'+(has?' has':' leaf')+(depth===0?' root':''); d.tabIndex=has?0:-1;
  let label=o.l; let note='';
  if(!has){const m=label.match(/^(.*?)[：（]/); }
  d.append(document.createTextNode(label));
  if(has){const c=document.createElement('span'); c.className='c'; c.textContent=o.k.length; d.append(c);
    const a=document.createElement('span'); a.className='a'; a.textContent='▶'; d.prepend(a);
    d.setAttribute('role','button'); d.setAttribute('aria-expanded',depth<2);
    const tog=()=>{const open=li.classList.toggle('open'); d.setAttribute('aria-expanded',open)};
    d.onclick=tog; d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}};
    if(depth<2) li.classList.add('open');}
  li.append(d);
  if(has){const ul=document.createElement('ul'); ul.className='kids';
    o.k.forEach((c,i)=>ul.append(build(c,depth+1,depth===0?Math.round(i*360/o.k.length+205)%360:h)));
    li.append(ul);}
  return li;
}
root.append(build(D,0));
const all=()=>[...root.querySelectorAll('li')].filter(l=>l.querySelector(':scope>ul.kids'));
document.getElementById('ex').onclick=()=>all().forEach(l=>{l.classList.add('open');l.firstChild.setAttribute('aria-expanded',true)});
document.getElementById('co').onclick=()=>all().forEach(l=>{const dp=l.parentElement.id==='root'?0:(l.parentElement.closest('li').parentElement.id==='root'?1:2);const o=dp<2;l.classList.toggle('open',o);l.firstChild.setAttribute('aria-expanded',o)});
document.getElementById('q').oninput=e=>{
  const v=e.target.value.trim().toLowerCase();
  root.querySelectorAll('.nd').forEach(x=>x.classList.remove('hit'));
  if(!v) return;
  let first=null;
  root.querySelectorAll('.nd').forEach(x=>{ if(x.textContent.toLowerCase().includes(v)){x.classList.add('hit'); first=first||x;
    let p=x.parentElement; while(p&&p.id!=='root'){ if(p.tagName==='LI') {p.classList.add('open'); if(p.firstChild.setAttribute) p.firstChild.setAttribute('aria-expanded',true)} p=p.parentElement;}}});
  if(first) first.scrollIntoView({block:'nearest',inline:'center'});
};
