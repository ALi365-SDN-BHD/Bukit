name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        default: 0.0.0-ci
        type: string
      rids:
        description: Runtime identifiers to package
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - osx-arm64
          - win-x64
          - all
      publish:
        description: Create GitHub Release
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          RIDS: ${{ inputs.rids }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-][A-Za-z0-9._-]+)?$ ]]
          if [[ "$PUBLISH" == "true" && "$RIDS" != "all" ]]; then exit 1; fi
          if [[ "$PUBLISH" == "true" && "$VERSION" == "0.0.0-ci" ]]; then exit 1; fi

  fast-contracts:
    name: Fast contracts
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore Core
        run: dotnet restore bukit-core.slnx
      - name: Run fast gate
        run: bash scripts/gates/ci-fast.sh Release
      - name: Restore Architecture tests
        run: dotnet restore tests/Bukit.Architecture.Tests/Bukit.Architecture.Tests.csproj
      - name: Run Architecture contracts
        run: dotnet test tests/Bukit.Architecture.Tests/Bukit.Architecture.Tests.csproj -c Release --no-restore

  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    needs: fast-contracts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore tests
        run: dotnet restore bukit-test.slnx
      - name: Run Core tests
        run: BUKIT_CI_FULL_SKIP_FAST=1 bash scripts/gates/ci-full.sh Release

  coverage-plan:
    name: Core coverage plan
    runs-on: ubuntu-latest
    needs: fast-contracts
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
      count: ${{ steps.projects.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Check coverage output paths
        run: bash scripts/checks/coverage/output-path-self-test.sh
      - name: Check coverage project list failures
        run: bash scripts/checks/coverage/project-list-self-test.sh
      - name: Check coverage matrix
        run: bash scripts/checks/coverage/matrix-self-test.sh
      - name: Check coverage summary thresholds
        run: python3 scripts/checks/coverage/summarize-self-test.py
      - name: Validate coverage policy
        run: bash scripts/checks/coverage-baseline-schema.sh
      - id: projects
        name: Build coverage matrix
        run: |
          bash scripts/checks/coverage/list-core-projects.sh > coverage-projects.tsv
          echo "matrix=$(bash scripts/checks/coverage/matrix.py coverage-projects.tsv)" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < coverage-projects.tsv | tr -d ' ')" >> "$GITHUB_OUTPUT"

  coverage-projects:
    name: "Core coverage: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: coverage-plan
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore ${{ matrix.name }}
        run: dotnet restore "${{ matrix.project }}"
      - name: Collect ${{ matrix.name }} coverage
        env:
          COVERAGE_FILTER: ${{ matrix.filter }}
        run: bash scripts/checks/coverage/run-one.sh Release "${{ matrix.project }}" TestResults/coverage/projects "$COVERAGE_FILTER"
      - uses: actions/upload-artifact@v7
        with:
          name: core-coverage-project-${{ matrix.name }}
          path: TestResults/coverage/projects
          if-no-files-found: error

  coverage-summary:
    name: Core coverage
    runs-on: ubuntu-latest
    needs: [coverage-plan, coverage-projects]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: core-coverage-project-*
          path: TestResults/coverage/projects
          merge-multiple: true
      - name: Summarize Core coverage
        env:
          COVERAGE_PROJECT_COUNT: ${{ needs.coverage-plan.outputs.count }}
        run: |
          bash scripts/checks/coverage/find-results.sh TestResults/coverage/projects "$COVERAGE_PROJECT_COUNT" > TestResults/coverage/coverage-files.txt
          bash scripts/checks/coverage/summarize.py docs/coverage-baselines.json TestResults/coverage TestResults/coverage/coverage-files.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-coverage
          path: |
            TestResults/coverage
            docs/coverage-baselines.json
          if-no-files-found: error

  security-check:
    name: Security check
    runs-on: ubuntu-latest
    needs: fast-contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore security tests
        run: dotnet restore bukit-test.slnx
      - name: Run security regression entrypoint
        run: BUKIT_SECURITY_SKIP_RESTORE=1 bash scripts/security/security-regression.sh Release

  package-linux:
    name: Package linux-x64
    runs-on: ubuntu-latest
    needs: [core-tests, coverage-summary, security-check]
    if: ${{ inputs.rids == 'linux-x64' || inputs.rids == 'all' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - id: package
        name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/build/package-native-aot.sh "$VERSION" linux-x64 artifacts
      - name: Smoke packaged archive
        run: bash scripts/smoke/release-artifacts.sh "${{ steps.package.outputs.archive }}" linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: bukit-linux-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  package-macos:
    name: Package osx-arm64
    runs-on: macos-latest
    needs: [core-tests, coverage-summary, security-check]
    if: ${{ inputs.rids == 'osx-arm64' || inputs.rids == 'all' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - id: package
        name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/build/package-native-aot.sh "$VERSION" osx-arm64 artifacts
      - name: Smoke packaged archive
        run: bash scripts/smoke/release-artifacts.sh "${{ steps.package.outputs.archive }}" osx-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: bukit-osx-arm64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  package-windows:
    name: Package win-x64
    runs-on: windows-latest
    needs: [core-tests, coverage-summary, security-check]
    if: ${{ inputs.rids == 'win-x64' || inputs.rids == 'all' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - id: package
        name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/build/package-native-aot.sh "$VERSION" win-x64 artifacts
      - name: Smoke packaged archive
        run: bash scripts/smoke/release-artifacts.sh "${{ steps.package.outputs.archive }}" win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: bukit-win-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  collect-assets:
    name: Collect release assets
    runs-on: ubuntu-latest
    needs: [validate-inputs, core-tests, coverage-summary, security-check, package-linux, package-macos, package-windows]
    if: >-
      ${{
        always() &&
        needs.validate-inputs.result == 'success' &&
        needs.core-tests.result == 'success' &&
        needs.coverage-summary.result == 'success' &&
        needs.security-check.result == 'success' &&
        (needs.package-linux.result == 'success' || needs.package-linux.result == 'skipped') &&
        (needs.package-macos.result == 'success' || needs.package-macos.result == 'skipped') &&
        (needs.package-windows.result == 'success' || needs.package-windows.result == 'skipped')
      }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bukit-*
          path: downloaded-assets
          merge-multiple: true
      - name: Prepare assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mapfile -t assets < <(find downloaded-assets -type f | sort)
          bash scripts/release/prepare-release-assets.sh "$VERSION" "$GITHUB_SHA" release-assets "${assets[@]}"
      - name: Verify assets
        env:
          VERSION: ${{ inputs.version }}
          RIDS: ${{ inputs.rids }}
        run: |
          case "$RIDS" in
            linux-x64) expected_rids=(linux-x64) ;;
            osx-arm64) expected_rids=(osx-arm64) ;;
            win-x64) expected_rids=(win-x64) ;;
            all) expected_rids=(linux-x64 osx-arm64 win-x64) ;;
            *) echo "unsupported RID selection: $RIDS" >&2; exit 2 ;;
          esac
          bash scripts/release/verify-release-assets.sh "$VERSION" "$GITHUB_SHA" release-assets "${expected_rids[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: collect-assets
    if: ${{ inputs.publish == 'true' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Bukit ${{ inputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
