name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: .tar.gz
          - rid: osx-arm64
            os: macos-latest
            ext: .tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev+${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Native AOT
        run: >
          dotnet publish src/Bukit.Cli/Bukit.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o out/bukit-${{ matrix.rid }}
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:BukitStripSymbols=true

      - name: 复制用户文档到输出目录
        shell: bash
        run: |
          mkdir -p out/bukit-${{ matrix.rid }}/guide
          cp -r guide/user out/bukit-${{ matrix.rid }}/guide/user

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >
          Compress-Archive
          -Path out/bukit-${{ matrix.rid }}/*
          -DestinationPath bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip

      - name: Package (Linux/macOS)
        if: matrix.rid != 'win-x64'
        run: >
          tar -czf bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz
          -C out/bukit-${{ matrix.rid }} .

      - uses: actions/upload-artifact@v4
        with:
          name: bukit-${{ matrix.rid }}
          path: bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}${{ matrix.ext }}

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包 skills
        run: |
          cd src
          zip -r ../bukit-skills.zip skills/

      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bukit-*/bukit-*
            bukit-skills.zip
          generate_release_notes: true
