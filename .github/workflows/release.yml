name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    env:
      CORE_COVERAGE_THRESHOLD: "80"
      CLI_COVERAGE_THRESHOLD: "75"
      RELEASE_GATE_RIDS: linux-x64
      RELEASE_GATE_REQUIRED_BRANCHES: "main,master"
      RELEASE_GATE_REQUIRE_BRANCH_FILTER: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: bash scripts/gates/release.sh Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-gate-results
          path: TestResults/release-gate
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build ${{ matrix.rid }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: .tar.gz
          - rid: osx-arm64
            os: macos-latest
            ext: .tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev+${{ github.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Native AOT
        shell: bash
        run: >
          dotnet publish src/Bukit-Core/Bukit.Cli/Bukit.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o out/bukit-${{ matrix.rid }}
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:BukitStripSymbols=true
          -p:TrimmerSingleWarn=false

      - name: Smoke release artifact
        shell: bash
        run: bash scripts/smoke/release-artifacts.sh out/bukit-${{ matrix.rid }}

      - name: Copy user guide
        shell: bash
        run: |
          mkdir -p out/bukit-${{ matrix.rid }}/guide
          cp -R guide/user out/bukit-${{ matrix.rid }}/guide/user

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >
          Compress-Archive
          -Path out/bukit-${{ matrix.rid }}/*
          -DestinationPath bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip

      - name: Package Linux/macOS
        if: matrix.rid != 'win-x64'
        shell: bash
        run: >
          tar -czf bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz
          -C out/bukit-${{ matrix.rid }} .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bukit-${{ matrix.rid }}
          path: bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package skills
        run: |
          cd guide
          zip -r ../bukit-skills.zip skills/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093

      - name: Prepare release manifest and checksums
        env:
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION}"
          : "${VERSION:?VERSION must be set}"
          : "${COMMIT_SHA:?COMMIT_SHA must be set}"

          ASSETS=(
            "bukit-win-x64/bukit-${VERSION}-win-x64.zip"
            "bukit-linux-x64/bukit-${VERSION}-linux-x64.tar.gz"
            "bukit-osx-arm64/bukit-${VERSION}-osx-arm64.tar.gz"
            "bukit-skills.zip"
          )

          bash scripts/release/prepare-release-assets.sh "$VERSION" "$COMMIT_SHA" "${ASSETS[@]}"

      - name: Validate release assets
        run: |
          mkdir -p TestResults/release-assets
          mkdir -p release-assets
          cp -f "bukit-linux-x64/bukit-${{ steps.version.outputs.version }}-linux-x64.tar.gz" release-assets/
          cp -f "bukit-osx-arm64/bukit-${{ steps.version.outputs.version }}-osx-arm64.tar.gz" release-assets/
          cp -f "bukit-win-x64/bukit-${{ steps.version.outputs.version }}-win-x64.zip" release-assets/
          cp -f bukit-skills.zip release-assets/
          cp -f checksums.txt checksums.json release-manifest.json release-assets/

          echo "Strict set check: started"
          if bash scripts/checks/release-assets.sh release-assets "${{ steps.version.outputs.version }}" "${GITHUB_SHA}" | tee TestResults/release-assets/release-assets-check.md; then
            echo "Strict set check: passed"
          else
            status=$?
            echo "Strict set check: failed"
            exit $status
          fi

      - name: Release asset check summary
        if: always()
        run: |
          status_file=TestResults/release-assets/release-assets-check.md

          version="-"
          commit="-"
          required_files="-"
          artifact_count="-"
          checksums_txt_count="-"
          manifest_rids="-"
          set_mode="-"

          if [ -f "$status_file" ]; then
            version=$(grep -m1 '^version=' "$status_file" | cut -d= -f2- || printf '-')
            commit=$(grep -m1 '^commit=' "$status_file" | cut -d= -f2- || printf '-')
            required_files=$(grep -m1 '^required_files=' "$status_file" | cut -d= -f2- || printf '-')
            artifact_count=$(grep -m1 '^artifact_count=' "$status_file" | cut -d= -f2- || printf '-')
            checksums_txt_count=$(grep -m1 '^checksums_txt_count=' "$status_file" | cut -d= -f2- || printf '-')
            manifest_rids=$(grep -m1 '^manifest_rids=' "$status_file" | cut -d= -f2- || printf '-')
            set_mode=$(grep -m1 '^set_mode=' "$status_file" | cut -d= -f2- || printf '-')
          fi

          {
            echo "### Release asset strict check"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Version | ${version} |"
            echo "| Commit | ${commit} |"
            echo "| Expected mode | exact-match |"
            echo "| Set mode | ${set_mode} |"
            echo "| Required files | ${required_files} |"
            echo "| Artifact count | ${artifact_count} |"
            echo "| Checksums.txt entries | ${checksums_txt_count} |"
            echo "| Manifest RIDs | ${manifest_rids} |"
            echo ""
            if [ -f "$status_file" ]; then
              echo '```'
              cat "$status_file"
              echo '```'
            else
              echo "release-assets-check.md not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-assets-evidence
          path: TestResults/release-assets/release-assets-check.md
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            release-assets/bukit-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            release-assets/bukit-${{ steps.version.outputs.version }}-osx-arm64.tar.gz
            release-assets/bukit-${{ steps.version.outputs.version }}-win-x64.zip
            release-assets/bukit-skills.zip
            release-assets/checksums.txt
            release-assets/checksums.json
            release-assets/release-manifest.json
            TestResults/release-assets/release-assets-check.md
          generate_release_notes: true
