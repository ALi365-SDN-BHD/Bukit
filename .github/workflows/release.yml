name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    env:
      CORE_COVERAGE_THRESHOLD: "65"
      CLI_COVERAGE_THRESHOLD: "50"
      RELEASE_GATE_RIDS: linux-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/gates/release.sh Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-gate-results
          path: TestResults/release-gate
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build ${{ matrix.rid }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: .tar.gz
          - rid: osx-arm64
            os: macos-latest
            ext: .tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev+${{ github.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Native AOT
        shell: bash
        run: >
          dotnet publish src/Bukit.Cli/Bukit.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o out/bukit-${{ matrix.rid }}
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:BukitStripSymbols=true
          -p:TrimmerSingleWarn=false

      - name: Smoke release artifact
        shell: bash
        run: bash scripts/smoke/release-artifacts.sh out/bukit-${{ matrix.rid }}

      - name: Copy user guide
        shell: bash
        run: |
          mkdir -p out/bukit-${{ matrix.rid }}/guide
          cp -R guide/user out/bukit-${{ matrix.rid }}/guide/user

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >
          Compress-Archive
          -Path out/bukit-${{ matrix.rid }}/*
          -DestinationPath bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip

      - name: Package Linux/macOS
        if: matrix.rid != 'win-x64'
        shell: bash
        run: >
          tar -czf bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz
          -C out/bukit-${{ matrix.rid }} .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bukit-${{ matrix.rid }}
          path: bukit-${{ steps.version.outputs.version }}-${{ matrix.rid }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Package skills
        run: |
          cd guide
          zip -r ../bukit-skills.zip skills/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            bukit-*/bukit-*
            bukit-skills.zip
          generate_release_notes: true
