name: Core minor Windows verification

on:
  push:
    branches:
      - codex/core-close-1-9

permissions:
  contents: read

concurrency:
  group: core-close-windows-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-minor-windows:
    name: Core minor tests and Native AOT
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Assert Windows runner
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected a real GitHub-hosted Windows runner."
          }
          Write-Host "Windows runtime: $([System.Environment]::OSVersion.VersionString)"

      - name: Verify pagination visibility contract
        run: >-
          dotnet test tests/Bukit.Architecture.Tests/Bukit.Architecture.Tests.csproj
          -c Release --verbosity minimal
          --filter "FullyQualifiedName~NotionPaginationInfrastructure_MustRemainInternal"

      - name: Verify public Content pagination failure
        run: >-
          dotnet test tests/Bukit.Content.Tests/Bukit.Content.Tests.csproj
          -c Release --verbosity minimal
          --filter "FullyQualifiedName~LoadAsync_WhenHasMoreWithoutCursor_ThrowsStablePaginationException"

      - name: Verify internal Notion pagination contract
        run: >-
          dotnet test tests/Bukit.Notion.Tests/Bukit.Notion.Tests.csproj
          -c Release --verbosity minimal
          --filter "FullyQualifiedName~NotionBlocksRendererPaginationTests|FullyQualifiedName~NotionBlockRendererCompatibilityEdgeCasesTests"

      - name: Compile the ImageOptimizer regression test on Windows
        run: dotnet build tests/Bukit.Engine.Tests/Bukit.Engine.Tests.csproj -c Release --verbosity minimal

      - name: Publish win-x64 Native AOT
        run: |
          dotnet publish src/Bukit-Core/Bukit.Cli/Bukit.Cli.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishAot=true -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "win-x64 Native AOT publish failed."
          }

      - name: Smoke win-x64 Native AOT
        run: |
          $version = & artifacts/win-x64/bukit.exe version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "runtime:\s*native-aot") {
            throw "Native AOT version smoke failed: $version"
          }
          & artifacts/win-x64/bukit.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT help smoke failed."
          }
