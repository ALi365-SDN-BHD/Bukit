name: Core minor Windows verification

on:
  push:
    branches:
      - codex/core-close-1-9

permissions:
  contents: read

concurrency:
  group: core-close-windows-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-minor-windows:
    name: Core minor tests and Native AOT
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Assert Windows runner
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected a real GitHub-hosted Windows runner."
          }
          Write-Host "Windows runtime: $([System.Environment]::OSVersion.VersionString)"

      - name: Run Architecture owner tests
        id: architecture_tests
        continue-on-error: true
        run: dotnet test tests/Bukit.Architecture.Tests/Bukit.Architecture.Tests.csproj -c Release --verbosity minimal

      - name: Run Content owner tests
        id: content_tests
        continue-on-error: true
        run: dotnet test tests/Bukit.Content.Tests/Bukit.Content.Tests.csproj -c Release --verbosity minimal

      - name: Run Notion owner tests
        id: notion_tests
        continue-on-error: true
        run: dotnet test tests/Bukit.Notion.Tests/Bukit.Notion.Tests.csproj -c Release --verbosity minimal

      - name: Run Engine owner tests
        id: engine_tests
        continue-on-error: true
        run: dotnet test tests/Bukit.Engine.Tests/Bukit.Engine.Tests.csproj -c Release --verbosity minimal

      - name: Publish win-x64 Native AOT
        id: aot_publish
        if: always()
        continue-on-error: true
        run: |
          dotnet publish src/Bukit-Core/Bukit.Cli/Bukit.Cli.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishAot=true -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "win-x64 Native AOT publish failed."
          }

      - name: Smoke win-x64 Native AOT
        id: aot_smoke
        if: always() && steps.aot_publish.outcome == 'success'
        continue-on-error: true
        run: |
          $version = & artifacts/win-x64/bukit.exe version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "runtime:\s*native-aot") {
            throw "Native AOT version smoke failed: $version"
          }
          & artifacts/win-x64/bukit.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT help smoke failed."
          }

      - name: Project verification outcomes
        if: always()
        run: |
          $outcomes = @{
            architecture = "${{ steps.architecture_tests.outcome }}"
            content = "${{ steps.content_tests.outcome }}"
            notion = "${{ steps.notion_tests.outcome }}"
            engine = "${{ steps.engine_tests.outcome }}"
            aot_publish = "${{ steps.aot_publish.outcome }}"
            aot_smoke = "${{ steps.aot_smoke.outcome }}"
          }
          foreach ($entry in $outcomes.GetEnumerator() | Sort-Object Name) {
            Write-Host "$($entry.Name)=$($entry.Value)"
          }
          $failed = @($outcomes.GetEnumerator() | Where-Object { $_.Value -ne "success" })
          if ($failed.Count -ne 0) {
            throw "Windows verification failed: $($failed.Name -join ', ')"
          }
