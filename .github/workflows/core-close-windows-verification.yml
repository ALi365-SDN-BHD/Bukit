name: Core close Windows verification

on:
  push:
    branches:
      - codex/core-close-1-9

permissions:
  contents: read

concurrency:
  group: core-close-windows-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pluginhost-windows-runtime:
    name: PluginHost Windows runtime proof
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Assert Windows runner
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected a real GitHub-hosted Windows runner."
          }
          Write-Host "Windows runtime: $([System.Environment]::OSVersion.VersionString)"

      - name: Restore PluginHost tests
        run: dotnet restore tests/Bukit.PluginHost.Tests/Bukit.PluginHost.Tests.csproj

      - name: Run targeted PluginHost tests on Windows
        id: pluginhost-tests
        continue-on-error: true
        run: >-
          dotnet test tests/Bukit.PluginHost.Tests/Bukit.PluginHost.Tests.csproj
          -c Release --no-restore --verbosity minimal
          --filter "FullyQualifiedName=Bukit.PluginHost.Tests.SystemProcessRunnerTests.RunAsync_ChildMemoryExceedsTreeLimit_ReturnsResourceLimitExceeded|FullyQualifiedName=Bukit.PluginHost.Tests.SystemProcessRunnerTests.RunAsync_CombinedChildMemoryExceedsTreeLimit_ReturnsResourceLimitExceeded|FullyQualifiedName=Bukit.PluginHost.Tests.SystemProcessRunnerTests.RunAsync_NormalParentExitWithInheritedPipe_TerminatesTreeAndFailsRun"
          --logger "trx;LogFileName=pluginhost-windows.trx"
          --results-directory artifacts/test-results

      - name: Project Windows test diagnostics
        if: always()
        run: |
          $trxPath = "artifacts/test-results/pluginhost-windows.trx"
          if (-not (Test-Path $trxPath)) {
            throw "The PluginHost test run did not produce its TRX evidence."
          }

          [xml]$document = Get-Content $trxPath
          $results = @($document.SelectNodes("//*[local-name()='UnitTestResult']"))
          $failed = @($results | Where-Object { $_.outcome -eq "Failed" })

          "## Windows PluginHost test diagnostics" | Out-File $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Executed: $($results.Count); failed: $($failed.Count)." | Add-Content $env:GITHUB_STEP_SUMMARY

          foreach ($failure in $failed) {
            $messageNode = $failure.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='Message']")
            $stackNode = $failure.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='StackTrace']")
            $message = if ($null -eq $messageNode) { "No failure message recorded." } else { $messageNode.InnerText.Trim() }
            $stack = if ($null -eq $stackNode) { "No stack trace recorded." } else { $stackNode.InnerText.Trim() }
            $diagnostic = "$($failure.testName)`n$message`n$stack"
            if ($diagnostic.Length -gt 6000) {
              $diagnostic = $diagnostic.Substring(0, 6000) + "`n[truncated]"
            }
            $annotation = $diagnostic.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows PluginHost test failure::$annotation"

            "" | Add-Content $env:GITHUB_STEP_SUMMARY
            "### $($failure.testName)" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            $message | Add-Content $env:GITHUB_STEP_SUMMARY
            $stack | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          if ("${{ steps.pluginhost-tests.outcome }}" -ne "success") {
            throw "PluginHost tests failed on Windows; diagnostics were projected above."
          }

      - name: Verify Windows Job Object evidence
        run: |
          [xml]$document = Get-Content "artifacts/test-results/pluginhost-windows.trx"
          $results = @($document.SelectNodes("//*[local-name()='UnitTestResult']"))
          if ($results.Count -eq 0) {
            throw "The PluginHost TRX contains no executed tests."
          }

          $requiredTests = @(
            "RunAsync_ChildMemoryExceedsTreeLimit_ReturnsResourceLimitExceeded",
            "RunAsync_CombinedChildMemoryExceedsTreeLimit_ReturnsResourceLimitExceeded",
            "RunAsync_NormalParentExitWithInheritedPipe_TerminatesTreeAndFailsRun"
          )
          foreach ($requiredTest in $requiredTests) {
            $matches = @($results | Where-Object { $_.testName -like "*$requiredTest*" })
            if ($matches.Count -eq 0) {
              throw "Required Windows runtime test did not execute: $requiredTest"
            }
            if (@($matches | Where-Object { $_.outcome -ne "Passed" }).Count -ne 0) {
              throw "Required Windows runtime test did not pass: $requiredTest"
            }
          }

          Write-Host "Windows Job Object runtime proof OK: $($results.Count) PluginHost tests passed."

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bukit-core-close-windows-pluginhost-trx
          path: artifacts/test-results/pluginhost-windows.trx
          if-no-files-found: error
