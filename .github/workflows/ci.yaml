name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "1.0.*"
      - "release/**"
      - "maintenance/**"
  workflow_dispatch:
    inputs:
      gate:
        description: Gate to run
        required: true
        default: core
        type: choice
        options:
          - fast
          - core
          - coverage

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore Core
        run: dotnet restore bukit-core.slnx
      - name: Run fast gate
        run: bash scripts/gates/ci-fast.sh Release

  architecture-contracts:
    name: Architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore Architecture tests
        run: dotnet restore tests/Bukit.Architecture.Tests/Bukit.Architecture.Tests.csproj
      - name: Run Architecture contracts
        run: dotnet test tests/Bukit.Architecture.Tests/Bukit.Architecture.Tests.csproj -c Release --no-restore

  fast-contracts:
    name: Fast contracts
    runs-on: ubuntu-latest
    needs: [fast-gate, architecture-contracts]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require all fast evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_FAST'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          required = ["fast-gate", "architecture-contracts"]
          failed = [name for name in required if needs.get(name, {}).get("result") != "success"]
          if failed:
              raise SystemExit("Required fast evidence failed, cancelled, skipped or missing: " + ", ".join(failed))
          print("All required fast evidence succeeded")
          PY_FAST

  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    needs: [coverage-plan, coverage-projects, coverage-summary, platform-tests]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.gate == 'core') }}
    timeout-minutes: 5
    steps:
      - name: Require all Core evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_CORE'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          required = ["coverage-plan", "coverage-projects", "coverage-summary", "platform-tests"]
          failed = [name for name in required if needs.get(name, {}).get("result") != "success"]
          if failed:
              raise SystemExit("Required Core evidence failed, cancelled, skipped or missing: " + ", ".join(failed))
          print("All required Core evidence succeeded")
          PY_CORE

  platform-tests:
    name: "Platform: ${{ matrix.os }} ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    needs: fast-contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.gate == 'core' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            arch: x64
          - runner: macos-15
            os: Darwin
            arch: arm64
          - runner: windows-2025
            os: Windows
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run non-instrumented platform specialties
        shell: python
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          import json, os, platform, re, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          results = Path(os.environ.get("BUKIT_PLATFORM_RESULTS", "TestResults/platform"))
          results.mkdir(parents=True, exist_ok=True)
          expected_os, expected_arch = os.environ["EXPECTED_OS"], os.environ["EXPECTED_ARCH"]
          actual_os = platform.system()
          info = subprocess.check_output(["dotnet", "--info"], text=True)
          sdk = subprocess.check_output(["dotnet", "--version"], text=True).strip()
          host_arch = re.search(r"Host:\s+.*?Architecture:\s+(\S+)", info, re.S).group(1).lower()
          (results / "dotnet-info.txt").write_text(info, encoding="utf-8")
          evidence = {"os": actual_os, "machine": platform.machine(), "processArchitecture": host_arch, "sdk": sdk, "projects": []}
          (results / "platform.json").write_text(json.dumps(evidence, indent=2), encoding="utf-8")
          if actual_os != expected_os or host_arch != expected_arch:
              raise SystemExit("Platform verification gap: actual OS or .NET host architecture does not match matrix")
          requested = json.loads(Path("global.json").read_text())["sdk"]
          actual_version = tuple(map(int, sdk.split(".")))
          minimum = tuple(map(int, requested["version"].split(".")))
          if requested.get("rollForward") != "latestFeature" or actual_version[:2] != minimum[:2] or actual_version < minimum:
              raise SystemExit("SDK does not satisfy global.json latestFeature policy")

          classes = {
              "Bukit.PluginHost.Tests": ["Bukit.PluginHost.Tests.SystemProcessRunnerTests", "Bukit.PluginHost.Tests.PluginPathValidatorTests"],
              "Bukit.Engine.Tests": ["Bukit.Engine.Tests.ExternalToolProcessRunnerTests"],
          }
          if actual_os != "Linux":
              classes["Bukit.Engine.Tests"] += ["Bukit.Engine.Tests.SafeOutputFileSystemTests", "Bukit.Engine.Tests.DirectoryCopyFollowSymlinksTests"]
              classes["Bukit.Shared.Tests"] = ["Bukit.Shared.Tests.PlatformPathHelperTests", "Bukit.Shared.Tests.PathUtilsTests", "Bukit.Shared.Tests.PlatformSafeSourceFileOpenerTests"]
              classes["Bukit.Cli.Tests"] = ["Bukit.Cli.Tests.PreviewCommandTests", "Bukit.Cli.Tests.PreviewCommandExtendedTests", "Bukit.Cli.Tests.DevCommandTests"]

          posix_process_methods = {
              "MacWrapper_StatePathWithSingleQuote_StillPublishesPgidAndRunsTool",
              "RunAsync_ParentExitWithPipeChild_TerminatesTreeAndReaders",
              "RunAsync_FloodsStdoutAndStderr_CompletesWithoutDeadlock",
              "RunAsync_TimesOut_KillsDescendantBeforeDelayedWrite",
              "ScssCompiler_ExitZeroWithoutCss_PreservesSource",
              "ScssCompiler_EntryPointUnset_CompilesAllFilesToStagingTree",
              "RunAsync_OutputBeyondLimit_TerminatesAndThrowsBoundedDiagnostic",
              "ExternalTool_OutputBeyondLimit_TerminatesTreeAndReturnsBoundedDiagnostic",
              "RunAsync_Timeout_WithInheritedPipes_ReturnsWithinDrainDeadline",
              "RunAsync_ParentExitsWithInheritedPipe_ReturnsWithinDrainDeadline",
          }
          if actual_os == "Windows":
              allowed_na = {"Bukit.Engine.Tests.ExternalToolProcessRunnerTests." + name for name in posix_process_methods} | {
                  "Bukit.Shared.Tests.PlatformSafeSourceFileOpenerTests.Open_WhenTargetIsFifo_FailsClosedWithoutBlocking",
                  "Bukit.Shared.Tests.PlatformPathHelperTests.PathComparison_OnNonWindows_ReturnsOrdinal",
                  "Bukit.Cli.Tests.DevCommandTests.DevPathGuard_OnNonWindows_RejectsCaseDifferentSiblingEscape",
              }
          else:
              allowed_na = {
                  "Bukit.Engine.Tests.ExternalToolProcessRunnerTests.RunAsync_WindowsNativeProcess_CapturesOutputAndExitCode",
                  "Bukit.Shared.Tests.PlatformPathHelperTests.PathComparison_OnWindows_ReturnsOrdinalIgnoreCase",
              }

          failed = []
          for project, selected in classes.items():
              output = results / project
              output.mkdir(exist_ok=True)
              trx = output / "tests.trx"
              trx.unlink(missing_ok=True)
              command = ["dotnet", "test", f"tests/{project}/{project}.csproj", "-c", "Release", "--filter", "|".join("FullyQualifiedName~" + name for name in selected), "--logger", "trx;LogFileName=tests.trx", "--results-directory", str(output)]
              print("Running:", command, flush=True)
              completed = subprocess.run(command)
              record = {"project": project, "command": command, "exitCode": completed.returncode}
              evidence["projects"].append(record)
              try:
                  root = ET.parse(trx).getroot()
                  counters = root.find("{*}ResultSummary/{*}Counters")
                  rows = root.findall("{*}Results/{*}UnitTestResult")
                  methods = {test.get("id"): test.find("{*}TestMethod") for test in root.findall("{*}TestDefinitions/{*}UnitTest")}
                  actual_by_class = dict.fromkeys(selected, 0)
                  not_applicable = []
                  for row in rows:
                      if row.get("outcome") != "Passed":
                          raise ValueError(f"Failed or unexpected skipped test: {row.get('testName')} ({row.get('outcome')})")
                      method = methods[row.get("testId")]
                      class_name = method.get("className").split(",")[0]
                      method_name = class_name + "." + method.get("name")
                      stdout = row.findtext("{*}Output/{*}StdOut", "")
                      if class_name not in actual_by_class:
                          raise ValueError("Unexpected selected class: " + class_name)
                      if "BUKIT_NOT_APPLICABLE:" in stdout:
                          if method_name not in allowed_na:
                              raise ValueError("Unapproved platform N/A: " + method_name)
                          not_applicable.append(method_name)
                      else:
                          actual_by_class[class_name] += 1
                  record.update(executedByClass=actual_by_class, notApplicable=not_applicable)
                  print(json.dumps(record, indent=2), flush=True)
                  if any(count == 0 for count in actual_by_class.values()):
                      raise ValueError("Selected class has no applicable executed tests")
                  if (root.find("{*}ResultSummary").get("outcome") not in ("Completed", "Passed")
                          or completed.returncode != 0 or int(counters.get("executed", "0")) != len(rows)
                          or int(counters.get("total", "0")) != len(rows)
                          or int(counters.get("passed", "0")) != len(rows)
                          or any(int(counters.get(key, "0")) != 0 for key in ("failed", "error", "timeout", "aborted", "notExecuted"))):
                      raise ValueError("Failed test process or invalid TRX counters")
              except (OSError, ET.ParseError, AttributeError, KeyError, ValueError) as error:
                  record["verificationGap"] = str(error)
                  failed.append(project)
                  print(f"{project}: verification gap: {error}", file=sys.stderr)
              (results / "platform.json").write_text(json.dumps(evidence, indent=2), encoding="utf-8")
          if failed:
              raise SystemExit("Platform verification incomplete: " + ", ".join(failed))
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.arch }}
          path: TestResults/platform
          if-no-files-found: error

  coverage-plan:
    name: Core coverage plan
    runs-on: ubuntu-latest
    needs: fast-contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.gate == 'core' || inputs.gate == 'coverage' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
      count: ${{ steps.projects.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Check coverage output paths
        run: bash scripts/checks/coverage/output-path-self-test.sh
      - name: Check coverage project list failures
        run: bash scripts/checks/coverage/project-list-self-test.sh
      - name: Check coverage runner evidence
        run: bash scripts/checks/coverage-run-one-self-test.sh
      - name: Check coverage matrix
        run: bash scripts/checks/coverage/matrix-self-test.sh
      - name: Check coverage summary thresholds
        run: python3 scripts/checks/coverage/summarize-self-test.py
      - name: Validate coverage policy
        run: bash scripts/checks/coverage-baseline-schema.sh
      - id: projects
        name: Build coverage matrix
        run: |
          bash scripts/checks/coverage/list-core-projects.sh > coverage-projects.tsv
          echo "matrix=$(bash scripts/checks/coverage/matrix.py coverage-projects.tsv)" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < coverage-projects.tsv | tr -d ' ')" >> "$GITHUB_OUTPUT"

  coverage-projects:
    name: "Core coverage: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: coverage-plan
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore ${{ matrix.name }}
        run: dotnet restore "${{ matrix.project }}"
      - name: Collect ${{ matrix.name }} coverage
        env:
          COVERAGE_FILTER: ${{ matrix.filter }}
        run: bash scripts/checks/coverage/run-one.sh Release "${{ matrix.project }}" TestResults/coverage/projects "$COVERAGE_FILTER"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-coverage-project-${{ matrix.name }}
          path: TestResults/coverage/projects
          if-no-files-found: error

  coverage-summary:
    name: Core coverage
    runs-on: ubuntu-latest
    needs: [coverage-plan, coverage-projects]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: core-coverage-project-*
          path: TestResults/coverage/projects
          merge-multiple: true
      - name: Summarize Core coverage
        env:
          COVERAGE_PROJECT_COUNT: ${{ needs.coverage-plan.outputs.count }}
        run: |
          bash scripts/checks/coverage/find-results.sh TestResults/coverage/projects "$COVERAGE_PROJECT_COUNT" > TestResults/coverage/coverage-files.txt
          bash scripts/checks/coverage/summarize.py docs/coverage-baselines.json TestResults/coverage TestResults/coverage/coverage-files.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-coverage
          path: |
            TestResults/coverage
            docs/coverage-baselines.json
          if-no-files-found: error
