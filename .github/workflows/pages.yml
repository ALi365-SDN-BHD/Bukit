name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [bukit_notion]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish bukit (Native AOT)
        run: >
          dotnet publish src/Bukit.Cli/Bukit.Cli.csproj
          -c Release
          -r linux-x64
          -o out/bukit
          -p:PublishAot=true
          -p:PublishSingleFile=true

      - name: Compute base URL
        id: url
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "BASE_URL=/" >> $GITHUB_OUTPUT
            echo "SITE_URL=https://${OWNER}.github.io" >> $GITHUB_OUTPUT
            echo "IS_ORG_PAGE=true" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=/${REPO_NAME}" >> $GITHUB_OUTPUT
            echo "SITE_URL=https://${OWNER}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT
            echo "IS_ORG_PAGE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: >
          ./out/bukit/bukit build
          --config site.yaml
          --output _site
          --base-url "${{ steps.url.outputs.BASE_URL }}"
          --site-url "${{ steps.url.outputs.SITE_URL }}"
          --ci
          --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
