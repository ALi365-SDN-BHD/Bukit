ests/fixtures/i18n-site/site.yaml": "9cc8ed194641ae805880de1bc5530e86fffdc84481644fa248f5aedfb1a8a6f7", "tests/fixtures/taxonomy-site/content/another-post.md": "8d501138bd8106dbc34f6bbf2f223004c5e75a37eab309404cc97598d3a08eb6", "tests/fixtures/taxonomy-site/content/index.md": "35c321d5477e222a6fc12d5ab23a2616d46f4a58fefe4430847afb64b2015421", "tests/fixtures/taxonomy-site/layouts/layouts/base.html": "870df11b4b4ff548b2628e87813ed551c45567c45e1a59c39eb824e2e9994ac5", "tests/fixtures/taxonomy-site/layouts/pages/index.html": "755e73a1068a03562e789724c816c2cb1a925824de2e1818495dfa78ec108a5e", "tests/fixtures/taxonomy-site/layouts/pages/page.html": "214961ad4e68bda3ada5227130f0933d8aae7e147705889b536ddc806d9ceb2f", "tests/fixtures/taxonomy-site/layouts/pages/taxonomy-index.html": "f96c3e772ea3ce3d88913cc8f594817e34d830a10d0d2ca01c6e9b5ae858d97e", "tests/fixtures/taxonomy-site/layouts/pages/taxonomy-term.html": "304843d662bafbbc874dead94a9e2f26a88b15190a1b79af23437fb031323d67", "tests/fixtures/taxonomy-site/layouts/theme.yaml": "9d81ec8486af1aa1b9c8db7c16c0ed7d26d92a129012d0491ac3bbb958da68a2", "tests/fixtures/taxonomy-site/site.yaml": "ed22272340c748087ae810d8c886679c63b1eb47a48920eca8005f6d3f9e38a2"}
          environment = ['BUKIT_AUTO_SUMMARY', 'BUKIT_AUTO_SUMMARY_MAXLEN', 'BUKIT_BUILD_MODE', 'BUKIT_COVERAGE_SETTINGS', 'BUKIT_PLATFORM_RESULTS', 'BUKIT_PLUGIN_ALLOWED_ENV', 'BUKIT_PLUGIN_RUNNER_SECRET', 'BUKIT_PROFILE', 'BUKIT_RELEASE', 'BUKIT_SPAN_ID', 'BUKIT_TRACE_ID', 'CI', 'DOTNET_ADDITIONAL_DEPS', 'DOTNET_CLI_HOME', 'DOTNET_CLI_TELEMETRY_OPTOUT', 'DOTNET_CLI_UI_LANGUAGE', 'DOTNET_EnableDiagnostics', 'DOTNET_HOST_PATH', 'DOTNET_INSTALL_DIR', 'DOTNET_MSBUILD_SDK_RESOLVER_CLI_DIR', 'DOTNET_MSBUILD_SDK_RESOLVER_SDKS_DIR', 'DOTNET_MSBUILD_SDK_RESOLVER_SDKS_VER', 'DOTNET_MULTILEVEL_LOOKUP', 'DOTNET_NOLOGO', 'DOTNET_ROLL_FORWARD', 'DOTNET_ROLL_FORWARD_TO_PRERELEASE', 'DOTNET_ROOT', 'DOTNET_ROOT_ARM64', 'DOTNET_ROOT_X64', 'DOTNET_SHARED_STORE', 'DOTNET_STARTUP_HOOKS', 'DOTNET_SYSTEM_GLOBALIZATION_INVARIANT', 'GITHUB_ACTIONS', 'HOME', 'LANG', 'LC_ALL', 'LC_CTYPE', 'MSBUILDDISABLENODEREUSE', 'MSBUILD_EXE_PATH', 'MSBuildSDKsPath', 'NOTION_TOKEN', 'NUGET_HTTP_CACHE_PATH', 'NUGET_PACKAGES', 'PATH', 'PYTHONHASHSEED', 'PYTHONHOME', 'PYTHONIOENCODING', 'PYTHONPATH', 'PYTHONUTF8', 'TEMP', 'TMP', 'TMPDIR', 'TZ', 'VSTEST_HOST_DEBUG']
          evidence = {'os': platform.system(), 'osVersion': platform.platform(), 'machine': platform.machine(),
                      'python': platform.python_version(), 'commands': [],
                      'environmentState': {name: ('unset' if name not in os.environ else
                                                'set' if os.environ[name] else 'empty') for name in environment}}
          def save():
              (output / 'platform.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          save()
          try:
              evidence['commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in sorted(expected_inputs)}
              evidence['sourceInputs'] = hashes
              evidence['sourceInputSha256'] = hashlib.sha256(
                  json.dumps(hashes, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              evidence['workflowSha256'] = hashlib.sha256(
                  Path('.github/workflows/core-phase0-evidence.yaml').read_bytes()).hexdigest()
              if not hashes or hashes != expected_inputs:
                  raise ValueError('Source bytes differ from the frozen input manifest')
              dotnet = str(Path(os.environ['DOTNET_ROOT']) / ('dotnet.exe' if platform.system() == 'Windows' else 'dotnet'))
              if Path(os.environ['DOTNET_HOST_PATH']) != Path(dotnet):
                  raise ValueError('Child process host differs from the private SDK executable')
              for name in ('MSBuildSDKsPath', 'DOTNET_MSBUILD_SDK_RESOLVER_SDKS_DIR',
                           'DOTNET_MSBUILD_SDK_RESOLVER_SDKS_VER', 'DOTNET_MSBUILD_SDK_RESOLVER_CLI_DIR'):
                  if os.environ.get(name):
                      raise ValueError('Unexpected SDK override is set: ' + name)
              info = subprocess.check_output([dotnet, '--info'], text=True)
              sdk = subprocess.check_output([dotnet, '--version'], text=True).strip()
              sdks = subprocess.check_output([dotnet, '--list-sdks'], text=True).splitlines()
              runtimes = subprocess.check_output([dotnet, '--list-runtimes'], text=True).splitlines()
              host = re.search(r'Host:\s+Version:\s+(\S+)\s+Architecture:\s+(\S+)', info)
              evidence.update(sdk=sdk, runtime=host.group(1) if host else None,
                              processArchitecture=host.group(2).lower() if host else None,
                              installedSdks=[line.split()[0] for line in sdks],
                              installedRuntimes=[line.split()[:2] for line in runtimes])
              arch = os.environ['EXPECTED_ARCH']
              machines = {'x64': ('x86_64', 'amd64'), 'arm64': ('arm64', 'aarch64')}
              if (evidence['os'] != os.environ['EXPECTED_OS'] or evidence['machine'].lower() not in machines[arch]
                      or evidence['processArchitecture'] != arch or sdk != '10.0.100'
                      or evidence['runtime'] != '10.0.0' or evidence['installedSdks'] != ['10.0.100']
                      or ['Microsoft.NETCore.App', '10.0.0'] not in evidence['installedRuntimes']
                      or any(row[1] != '10.0.0' for row in evidence['installedRuntimes'])):
                  raise ValueError('Actual OS, host architecture, SDK or runtime mismatch')
              save()
              selections = [('Bukit.Engine.Tests', 'Bukit.Engine.Tests.TestInfrastructureTests'),
                            ('Bukit.PluginHost.Tests', 'Bukit.PluginHost.Tests.PluginProtocolProbeTests')]
              for project, selected in selections:
                  results = output / project
                  results.mkdir(exist_ok=True)
                  trx = results / 'tests.trx'
                  trx.unlink(missing_ok=True)
                  command = [dotnet, 'test', f'tests/{project}/{project}.csproj', '-c', 'Release',
                             '--filter', 'FullyQualifiedName~' + selected, '--logger', 'trx;LogFileName=tests.trx',
                             '--results-directory', str(results)]
                  record = {'project': project, 'selectedClass': selected, 'command': command}
                  evidence['commands'].append(record)
                  save()
                  start = time.monotonic()
                  try:
                      with (results / 'command.log').open('w', encoding='utf-8') as log:
                          completed = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
                      record['exitCode'] = completed.returncode
                      root = ET.parse(trx).getroot()
                      rows = root.findall('{*}Results/{*}UnitTestResult')
                      counters = root.find('{*}ResultSummary/{*}Counters')
                      methods = {item.get('id'): item.find('{*}TestMethod')
                                 for item in root.findall('{*}TestDefinitions/{*}UnitTest')}
                      if not rows:
                          raise ValueError('Selected class has zero test rows')
                      for row in rows:
                          method = methods[row.get('testId')]
                          if row.get('outcome') != 'Passed':
                              raise ValueError('Non-passing/skip row: ' + str(row.get('testName')))
                          if method.get('className', '').split(',')[0] != selected:
                              raise ValueError('Unexpected selected class')
                      if 'BUKIT_NOT_APPLICABLE:' in ''.join(root.itertext()):
                          raise ValueError('Phase 0 classes require applicable execution; N/A is not permitted')
                      if (completed.returncode != 0 or root.find('{*}ResultSummary').get('outcome') not in ('Completed', 'Passed')
                              or any(int(counters.get(key, '-1')) != len(rows) for key in ('total', 'executed', 'passed'))
                              or any(int(counters.get(key, '0')) != 0 for key in
                                     ('failed', 'error', 'timeout', 'aborted', 'notExecuted', 'notRunnable',
                                      'inconclusive', 'disconnected', 'passedButRunAborted', 'pending', 'inProgress'))):
                          raise ValueError('Process failure or invalid TRX summary/counters')
                      record['executedByClass'] = {selected: len(rows)}
                  except (OSError, ET.ParseError, AttributeError, KeyError, ValueError) as error:
                      record['verificationGap'] = str(error)
                  finally:
                      record['durationMs'] = round((time.monotonic() - start) * 1000)
                      save()
              if any('verificationGap' in record for record in evidence['commands']):
                  raise ValueError('Scoped platform evidence failed; inspect retained logs and TRX')
          except Exception as error:
              evidence['verificationGap'] = str(error)
              raise
          finally:
              save()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-phase0-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/core-phase0-evidence
          if-no-files-found: error
