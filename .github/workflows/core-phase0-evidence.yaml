name: Core phase 0 evidence
on:
  push:
    branches: [evidence/core-phase0-20261025]
permissions:
  contents: read
concurrency:
  group: core-phase0-evidence-20261025
  cancel-in-progress: false
jobs:
  phase0:
    name: Phase 0 ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {runner: ubuntu-24.04, os: Linux, arch: x64}
          - {runner: windows-2025, os: Windows, arch: x64}
    env:
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_ROLL_FORWARD: Disable
    steps:
      - name: Record host and preserve source bytes
        shell: python
        run: |
          import json, os, platform, subprocess
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'core-phase0-evidence'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'initial-host.json').write_text(json.dumps({
              'os': platform.system(), 'machine': platform.machine(),
              'osVersion': platform.platform()}, indent=2), encoding='utf-8')
          subprocess.run(['git', 'config', '--global', 'core.autocrlf', 'false'], check=True)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install exact SDK and bundled runtime
        shell: python
        run: |
          import json, os, platform, subprocess, urllib.request
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          install = temporary / 'core-phase0-dotnet-10.0.100'
          assert not install.exists(), 'Private SDK directory must be fresh'
          windows = platform.system() == 'Windows'
          arch = os.environ['EXPECTED_ARCH']
          script = temporary / ('dotnet-install.ps1' if windows else 'dotnet-install.sh')
          urllib.request.urlretrieve('https://dot.net/v1/' + script.name, script)
          command = (['pwsh', '-NoProfile', '-File', str(script), '-Version', '10.0.100',
                      '-Architecture', arch, '-InstallDir', str(install), '-NoPath'] if windows else
                     ['bash', str(script), '--version', '10.0.100', '--architecture', arch,
                      '--install-dir', str(install), '--no-path'])
          (temporary / 'core-phase0-evidence/install-command.json').write_text(
              json.dumps(command, indent=2), encoding='utf-8')
          subprocess.run(command, check=True)
          host = install / ('dotnet.exe' if windows else 'dotnet')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(install) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in {'DOTNET_ROOT': str(install), 'DOTNET_ROOT_' + arch.upper(): str(install),
                                 'DOTNET_HOST_PATH': str(host)}.items():
                  output.write(key + '=' + value + '\n')
      - name: Collect scoped phase 0 evidence
        shell: python
        run: |
          import hashlib, json, os, platform, re, subprocess, time
          from pathlib import Path
          import xml.etree.ElementTree as ET

