name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: bash scripts/gates/ci-fast.sh Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-fast-results
          path: TestResults/ci-fast
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: Full Gate
    if: github.event_name != 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    env:
      CORE_COVERAGE_THRESHOLD: "80"
      CLI_COVERAGE_THRESHOLD: "75"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore bukit.slnx
      - run: dotnet build bukit.slnx -c Release
      - run: CI_FULL_SKIP_FAST=1 bash scripts/gates/ci-full.sh Release
      - run: bash scripts/checks/ci-workflow-evidence.sh "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "ci.yml" "TestResults/ci-workflow-evidence.json" 0 "TestResults/ci-workflow-evidence.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-full-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  cross-platform-tests:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore bukit.slnx
      - run: dotnet build bukit.slnx -c Release
      - run: dotnet test bukit.slnx -c Release --no-build --logger "trx" --results-directory TestResults/cross-platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-platform-${{ matrix.os }}
          path: TestResults/cross-platform
          if-no-files-found: ignore
          retention-days: 14

  native-aot:
    name: Native AOT (${{ matrix.rid }})
    if: github.event_name != 'pull_request'
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - shell: bash
        run: CONFIGURATION=Release bash scripts/build/native-aot.sh ${{ matrix.rid }} TestResults/native-aot/${{ matrix.rid }} TestResults/native-aot/${{ matrix.rid }}.log
      - shell: bash
        run: bash scripts/smoke/release-artifacts.sh TestResults/native-aot/${{ matrix.rid }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-aot-${{ matrix.rid }}
          path: TestResults/native-aot
          if-no-files-found: error
          retention-days: 14

  stress-cli:
    name: Stress CLI
    if: github.event_name == 'workflow_dispatch'
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/stress-test.sh 20 Release
