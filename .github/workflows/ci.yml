name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build bukit.slnx -c Release

      - name: Test with coverage
        run: dotnet test bukit.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Format
        run: dotnet format bukit.slnx --verify-no-changes

      - name: Doc asset consistency
        run: bash scripts/check-doc-asset-consistency.sh

      - name: Smoke test
        run: bash scripts/smoke.sh Release
