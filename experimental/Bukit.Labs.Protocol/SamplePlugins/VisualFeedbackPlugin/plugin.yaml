# plugin.yaml — VisualFeedbackPlugin 配置参考
# 将此文件中 plugins.visual-feedback 节点合并到 site.yaml 的顶层 plugins 节点下

plugins:

  # ---- 视觉反馈插件 ----
  # 构建完成后对每个页面进行多断点截图，通过 AI 分析视觉质量 (layout / readability / color / a11y / responsive)，
  # 输出评分报告到 dist/.bukit/visual-report.json。
  # 支持 OpenAI / Azure OpenAI / 兼容的 API 服务 (如 DeepSeek, Ollama with vision models)。
  visual-feedback:

    # ----------------------------------------------------------------
    # enabled — 是否启用插件
    # ----------------------------------------------------------------
    # 类型: bool
    # 默认: true
    # 设为 false 可跳过视觉分析（不影响其他插件）
    enabled: true

    # ----------------------------------------------------------------
    # pluginFailMode — 插件失败时的处理策略
    # ----------------------------------------------------------------
    # 类型: string
    # 可选值:
    #   - warn:  插件失败仅输出警告，构建正常完成 (推荐)
    #   - error: 插件失败立即抛出异常，终止构建
    # 默认: warn
    # 覆盖 site.yaml 顶层 site.pluginFailMode 的值 (仅对该插件生效)
    pluginFailMode: warn

    # ----------------------------------------------------------------
    # 插件私有配置 (options 节点内)
    # 所有字段均为可选，未配置时使用默认值
    # ----------------------------------------------------------------
    options:

      # ==============================================================
      # baseUrl — 预览服务器地址
      # ==============================================================
      # 类型: string
      # 默认: "http://localhost:4173"
      # 说明: 截图时访问页面的基础 URL，必须带协议。
      #       先用 `bukit preview --dir dist` 启动本地预览服务器，
      #       再运行本插件。如部署到 staging 环境也可填写远程地址。
      # 示例:
      #   baseUrl: "http://localhost:4173"
      #   baseUrl: "https://staging.example.com"
      baseUrl: "http://localhost:4173"

      # ==============================================================
      # captureWidths — 截图视口宽度列表 (px)
      # ==============================================================
      # 类型: int[]
      # 默认: [375, 768, 1440]
      # 说明: 每个页面在每个宽度下截取一张 fullPage 截图。
      #       375  → 主流手机竖屏
      #       768  → 平板竖屏 / 小笔记本
      #       1440 → 桌面显示器
      # 示例:
      #   captureWidths: [375, 768, 1440]
      #   captureWidths: [360, 414, 768, 1024, 1440, 1920]
      captureWidths: [375, 768, 1440]

      # ==============================================================
      # aiProvider — AI 服务提供商
      # ==============================================================
      # 类型: string
      # 默认: "openai"
      # 可选值:
      #   - openai:         api.openai.com (需 aiApiKey)
      #   - azure-openai:   需同时配置 aiEndpoint (Azure 自定义域名)
      #   - custom:         任意兼容 OpenAI Chat Completions API 的服务
      #                     需同时配置 aiEndpoint
      # 说明: 决定 LLM 请求的默认 endpoint 和认证头格式。
      #       使用 openai 时会自动拼接 https://api.openai.com/v1/chat/completions。
      #       使用 azure-openai 或 custom 时，aiEndpoint 为必填。
      aiProvider: "openai"

      # ==============================================================
      # aiModel — 使用的 AI 模型名称
      # ==============================================================
      # 类型: string
      # 默认: "gpt-4o"
      # 说明: 发送给 AI API 的 model 参数，必须是支持 vision (多模态图片输入) 的模型。
      # 推荐模型 (都需要 vision 能力):
      #   OpenAI:        gpt-4o / gpt-4-turbo / gpt-4-vision-preview
      #   Azure OpenAI:  gpt-4o (取决于部署名称)
      #   DeepSeek:      暂不支持 vision (截至 2025-Q2)
      #   Ollama:        llava / bakllava / minicpm-v
      #   Anthropic:     不支持 (非 OpenAI 兼容 API，需通过代理)
      # 示例:
      #   aiModel: "gpt-4o"
      #   aiModel: "gpt-4o-mini"
      aiModel: "gpt-4o"

      # ==============================================================
      # aiApiKey — API 密钥
      # ==============================================================
      # 类型: string
      # 默认: (无)
      # 说明: 调用 AI 服务的认证密钥。推荐使用环境变量而非硬编码:
      #   aiApiKey: "${OPENAI_API_KEY}"
      # 如果未配置，插件跳过 AI 分析，仅生成截图，评分全部置 0。
      # 安全注意: 不要将真实 API Key 提交到版本控制系统。
      aiApiKey: "${OPENAI_API_KEY}"

      # ==============================================================
      # aiEndpoint — 自定义 API 端点地址
      # ==============================================================
      # 类型: string
      # 默认: (无，由 aiProvider 决定)
      # 说明: 覆盖默认的 API endpoint。
      #   - aiProvider: "openai" 时不需配置 (默认 api.openai.com)
      #   - aiProvider: "azure-openai" 时必填
      #     如 https://<resource-name>.openai.azure.com/openai/deployments/<deployment>/chat/completions?api-version=2024-10-21
      #   - aiProvider: "custom" 时必填
      #     如 https://api.deepseek.com/v1/chat/completions 或 http://localhost:11434/v1/chat/completions (Ollama)
      # 示例:
      #   aiEndpoint: "https://my-resource.openai.azure.com/openai/deployments/gpt-4o/chat/completions?api-version=2024-10-21"
      #   aiEndpoint: "http://localhost:11434/v1/chat/completions"
      aiEndpoint: null

      # ==============================================================
      # outputReport — 输出报告文件路径
      # ==============================================================
      # 类型: string
      # 默认: ".bukit/visual-report.json"
      # 说明: 相对于 dist/ 目录的报告输出路径 (以 . 开头的相对路径会被解析到 dist/.bukit/ 下)。
      # 报告包含每页每宽度的 5 维评分、AI 反馈文本、问题列表。
      # 示例:
      #   outputReport: ".bukit/visual-report.json"
      #   outputReport: "visual-audit.json"
      outputReport: ".bukit/visual-report.json"

      # ==============================================================
      # screenshotDir — 截图保存目录
      # ==============================================================
      # 类型: string
      # 默认: ".bukit/screenshots"
      # 说明: 截图 PNG 文件的输出目录，相对于 dist/ 目录。
      #       命名规则: {url-slug}-w{width}.png
      #       如: -w375.png (首页 375px), -blog-first-post-w1440.png
      # 示例:
      #   screenshotDir: ".bukit/screenshots"
      #   screenshotDir: "visual-screenshots"
      screenshotDir: ".bukit/screenshots"
